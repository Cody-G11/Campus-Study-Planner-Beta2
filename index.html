<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raider Study Partner</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />
  <link rel="preconnect" href="calendar.html" />
  <link rel="preconnect" href="study-groups.html" crossorigin />
  <link rel="preconnect" href="campus-life.html"/>

   <link rel="stylesheet" href="css/homepage-globals.css" />
  <link rel="stylesheet" href="css/homepage-style.css" />
</head>

<body>
  <div id="viewport">
    <div class="miles-clark-homepage" id="stage">

      <a class="miles-group" href="calendar.html">
        <div class="miles-rectangle"></div>
        <div class="miles-schedule">Schedule</div>
      </a>

      <a class="miles-div" href="#">
        <div class="miles-rectangle-2"></div>
        <div class="miles-text-wrapper-2">Contact us</div>
      </a>

      <a class="miles-group-2" href="study-groups.html">
        <div class="miles-rectangle-3"></div>
        <div class="miles-study-groups">Study Groups</div>
      </a>

      <a class="miles-group-3" href="campus-life.html">
        <div class="miles-text-wrapper-5">Campus life</div>
      </a>

      <div class="miles-rectangle-4"></div>
      <div class="miles-text-wrapper-6">R</div>
      <div class="miles-text-wrapper-7">aider Study Partner</div>

      <h1 class="miles-find-your-study">
        Find your study<br />group before the<br />exam finds you
      </h1>
      <img src="images/redhand.jpg" alt="red hand" />

      <p class="miles-p">
        Search by the course you’re taking and join Red Raiders studying the
        same material on campus or online!
      </p>

      <form id="searchForm" autocomplete="off">
        <div class="miles-rectangle-5"></div>
        <input
          class="miles-text-wrapper-9"
          id="courseInput"
          type="text"
          placeholder="Type your course here...."
          aria-label="Course name"
        />
        <button class="miles-group-4" type="submit">Search here</button>
      </form>

      <p class="miles-search-error" id="error" role="alert"></p>
      <section class="miles-results" id="results" aria-live="polite"></section>

    </div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const viewport = document.getElementById("viewport");

    function fitToWindow() {
      const scale = viewport.clientWidth / 1440;
      stage.style.transform = "scale(" + scale + ")";
      viewport.style.height = stage.offsetHeight * scale + "px";
    }
    window.addEventListener("resize", fitToWindow);
    fitToWindow();

    const form = document.getElementById("searchForm");
    const input = document.getElementById("courseInput");
    const error = document.getElementById("error");
    const results = document.getElementById("results");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const course = input.value.trim();

      if (!course) {
        error.textContent = "Please type a course first (for example, MATH 1451).";
        results.innerHTML = "";
        input.focus();
        return;
      }

      error.textContent = "";
      const safe = escapeHtml(course.toUpperCase());

      results.innerHTML =
        '<h2 class="miles-results-title">Study groups for ' + safe + "</h2>" +
        '<div class="miles-group-card"><div>' + safe + " Exam Prep<small>Tue/Thu 6:00 PM · Library, 2nd floor</small></div><button type=\"button\">Join</button></div>" +
        '<div class="miles-group-card"><div>' + safe + " Online Review<small>Sundays 8:00 PM · Zoom</small></div><button type=\"button\">Join</button></div>";
    });
  </script>
</body>
</html>
